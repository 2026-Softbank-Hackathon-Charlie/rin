name: deploy

# Builds the image, pushes it to ECR as hopcharlie/rin:<sha> and deploys it on
# EC2 by default, or a restored GCP host over IAP. See deploy/gcp/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-rin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: [self-hosted, hopcharlie]
    timeout-minutes: 30
    env:
      RIN_DEPLOY_TARGET: ${{ vars.RIN_DEPLOY_TARGET || 'aws' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment target
        run: |
          case "$RIN_DEPLOY_TARGET" in aws|gcp) ;; *) echo 'invalid RIN_DEPLOY_TARGET' >&2; exit 1;; esac

      # rin-deploy trusts only this repository's main branch.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RIN_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # Self-hosted runners keep ~/.docker between jobs: log in to ECR in this job's temp dir.
      - name: Job-private Docker config
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/hopcharlie/rin:$GITHUB_SHA"
          docker build -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2
        if: env.RIN_DEPLOY_TARGET == 'aws'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          INSTANCE_ID: ${{ vars.RIN_INSTANCE_ID }}
        run: |
          # Runs as root on the host. deploy.sh and the compose files come from the
          # image itself, so the host always runs the scripts of the version it deploys.
          preflight="$(base64 < deploy/gcp/disk-preflight.sh | tr -d '\n')"
          params="$(jq -cn --arg image "$IMAGE" --arg preflight "$preflight" '{commands: [
            "set -eu",
            "export HOME=/root",
            "stage=$(mktemp -d /run/rin-deploy.XXXXXX)",
            "export DOCKER_CONFIG=$stage/docker",
            "trap \"rm -rf -- \\\"$stage\\\"\" EXIT",
            "printf %s \($preflight) | base64 -d > \"$stage/disk-preflight.sh\"",
            "image=\($image)",
            "bash \"$stage/disk-preflight.sh\" \"$image\"",
            "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin \"${image%%/*}\"",
            "docker pull -q \"$image\"",
            "cid=$(docker create \"$image\")",
            "docker cp \"$cid:/app/deploy/ec2/deploy.sh\" /srv/rin/deploy.sh",
            "docker cp \"$cid:/app/deploy/compose.db.yaml\" /srv/rin/compose.db.yaml",
            "docker cp \"$cid:/app/deploy/compose.app.yaml\" /srv/rin/compose.app.yaml",
            "docker rm \"$cid\" >/dev/null",
            "bash /srv/rin/deploy.sh \"$image\""
          ]}')"

          cmd_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "rin deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command $cmd_id"

          # Terminal states of an invocation: Success, Failed, Cancelled, TimedOut.
          status=""
          while :; do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
          done

          echo "::group::stdout"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::stderr"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          if [ "$status" != Success ]; then
            echo "::error::deploy on $INSTANCE_ID ended with $status"
            exit 1
          fi

      # Re-assume after push: this session and its registry token cannot upload images.
      - name: AWS read-only deployment session
        if: env.RIN_DEPLOY_TARGET == 'gcp'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RIN_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
              {"Effect":"Allow","Action":["ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability"],"Resource":"arn:aws:ecr:ap-northeast-2:*:repository/hopcharlie/rin"},
              {"Effect":"Allow","Action":"ssm:GetParametersByPath","Resource":["arn:aws:ssm:ap-northeast-2:*:parameter/rin","arn:aws:ssm:ap-northeast-2:*:parameter/rin/*"]},
              {"Effect":"Allow","Action":"kms:Decrypt","Resource":"*","Condition":{"StringEquals":{"kms:ViaService":"ssm.ap-northeast-2.amazonaws.com"},"StringLike":{"kms:EncryptionContext:PARAMETER_ARN":"arn:aws:ssm:ap-northeast-2:*:parameter/rin/*"}}}
            ]}

      - name: Authenticate for Rin IAP and OS Login
        if: env.RIN_DEPLOY_TARGET == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.RIN_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RIN_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: env.RIN_DEPLOY_TARGET == 'gcp'
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy on GCP through IAP
        if: env.RIN_DEPLOY_TARGET == 'gcp'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RIN_GCP_PROJECT_ID: ${{ vars.RIN_GCP_PROJECT_ID }}
          RIN_GCP_ZONE: ${{ vars.RIN_GCP_ZONE }}
          RIN_GCP_INSTANCE: ${{ vars.RIN_GCP_INSTANCE }}
        run: bash deploy/gcp/send.sh
