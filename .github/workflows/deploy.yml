name: deploy

# Builds the image, pushes it to ECR as hopcharlie/rin:<sha> and deploys it
# to the GCP host over IAP. See deploy/gcp/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-rin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # rin-deploy trusts only this repository's main branch.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RIN_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # Self-hosted runners keep ~/.docker between jobs: log in to ECR in this job's temp dir.
      - name: Job-private Docker config
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Unchanged layers come from the GitHub Actions cache instead of being
      # rebuilt, so they keep their digests and the host pulls only what changed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/hopcharlie/rin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image reference
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: echo "image=$REGISTRY/hopcharlie/rin:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Re-assume after push: this session and its registry token cannot upload images.
      - name: AWS read-only deployment session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RIN_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
              {"Effect":"Allow","Action":["ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability"],"Resource":"arn:aws:ecr:ap-northeast-2:*:repository/hopcharlie/rin"},
              {"Effect":"Allow","Action":"ssm:GetParametersByPath","Resource":["arn:aws:ssm:ap-northeast-2:*:parameter/rin","arn:aws:ssm:ap-northeast-2:*:parameter/rin/*"]},
              {"Effect":"Allow","Action":"kms:Decrypt","Resource":"*","Condition":{"StringEquals":{"kms:ViaService":"ssm.ap-northeast-2.amazonaws.com"},"StringLike":{"kms:EncryptionContext:PARAMETER_ARN":"arn:aws:ssm:ap-northeast-2:*:parameter/rin/*"}}}
            ]}

      - name: Authenticate for Rin IAP and OS Login
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.RIN_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RIN_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy on GCP through IAP
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RIN_GCP_PROJECT_ID: ${{ vars.RIN_GCP_PROJECT_ID }}
          RIN_GCP_ZONE: ${{ vars.RIN_GCP_ZONE }}
          RIN_GCP_INSTANCE: ${{ vars.RIN_GCP_INSTANCE }}
        run: bash deploy/gcp/send.sh
