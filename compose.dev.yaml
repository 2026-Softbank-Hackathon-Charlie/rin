# Local development: only Postgres. Run gateway and worker with `npm run dev:gateway` / `npm run dev:worker`.
name: rin-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rin
      POSTGRES_PASSWORD: rin
      POSTGRES_DB: rin
    ports:
      - "5433:5432"
    volumes:
      - rin-dev-pg:/var/lib/postgresql/data
volumes:
  rin-dev-pg:
