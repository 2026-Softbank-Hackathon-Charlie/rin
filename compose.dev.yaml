# Local development.
#   docker compose -f compose.dev.yaml up -d                 Postgres only (for npm run dev:* and tests)
#   docker build -t rin:local . && docker compose -f compose.dev.yaml --profile app up -d
#                                                            Postgres plus gateway and worker in containers,
#                                                            so Rin's commands run inside a container, not on the host.
name: rin-dev
services:
  gateway:
    profiles: [app]
    image: rin:local
    command: ["node", "dist/gateway/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://rin:rin@postgres:5432/rin
    security_opt: [no-new-privileges:true]
    depends_on: [postgres]
  worker:
    profiles: [app]
    image: rin:local
    command: ["node", "dist/worker/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://rin:rin@postgres:5432/rin
      RIN_WORKSPACE: /data/workspace
      RIN_CLAUDE_CONFIG_DIR: /data/claude
    volumes:
      - ./.data:/data
    # No sandbox here: Claude runs inside this container, so sudo from the image must not work.
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5m
    depends_on: [postgres]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rin
      POSTGRES_PASSWORD: rin
      POSTGRES_DB: rin
    ports:
      - "5433:5432"
    volumes:
      - rin-dev-pg:/var/lib/postgresql/data
volumes:
  rin-dev-pg:
